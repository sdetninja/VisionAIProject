# Local dev stack (see visionguard/MANUAL_TESTING.md): evidence frames are fetched from the M1 API on port 8001.
# M1's frame buffer keeps 30 s, so run the ingester with --follow while M1 is running.
db_path: data/incidents.db
evidence_dir: data/evidence
merge_window_sec: 10
max_evidence_frames: 3
draw_boxes: true
blur_faces: false
frame_source_url: http://127.0.0.1:8001
bus: jsonl
bus_path: data/bus/events.jsonl
outbox_max_attempts: 5
review_required_types: []
