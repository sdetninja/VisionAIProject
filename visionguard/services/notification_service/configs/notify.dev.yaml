# Local dev stack: console + JSONL log only (no Slack/email credentials needed).
dashboard_url: http://localhost:3000
db_path: data/notify.db
analysis_wait_sec: 30
rate_limit_per_min: 20
channels:
  console: {type: console}
  log:     {type: jsonl, path: data/notifications.jsonl}
routes:
  - {name: everything, match: {}, channels: [log]}
  - {name: high-and-up, match: {min_severity: HIGH}, channels: [console]}
  - {name: unrated, match: {severity: [UNRATED]}, channels: [console]}
escalations:
  - {name: supervisor-15m, after_min: 15, match: {min_severity: HIGH}, channels: [console]}
